<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk</title>
<script>/* the theme before the first paint: talk.theme is "light", "dark" or "system" */
try { const t = JSON.parse(localStorage.getItem("talk.theme") || '"light"');
  document.documentElement.dataset.theme = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">__PRECONNECT__
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/call.css">
</head>
<body>
<div class="app" id="app" data-state="idle">
  <div class="frame"><div class="stage">
    <div class="stagewrap" id="stagewrap"><iframe id="stage" title="Stage" allow="clipboard-read; clipboard-write"></iframe>
      <div class="veil" id="veil"><div class="loading" id="veilwait"><span class="spin"></span>Loading the stage…</div>
        <div class="failed" id="veilfail" hidden><p>The stage did not load.</p><div><button class="btn" id="reloadstage" type="button">Reload stage</button><a class="btn" id="openstage" target="_blank" rel="noopener">Open in a new tab</a></div></div></div></div>
    <p class="nostage" id="nostage" hidden>The stage is not available for this call.</p>
  </div></div>

  <section class="subs" id="subs" aria-label="Last answer" aria-live="polite">
    <div class="asked" id="asked" hidden><b>You</b> · <span id="askedtext"></span></div>
    <div class="cap" id="cap"></div>
    <div class="capnote" id="capnote" hidden></div>
    <div class="prep" id="prep" hidden><span class="preplbl" id="preplbl"></span><span class="preptrack"><i id="prepfill"></i></span></div>
    <div class="wave" id="wave" hidden><span class="bars" id="bars"></span><span class="rectime" id="rectime">0:00</span></div>
    <div class="status" id="status" hidden></div>
    <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Position in the answer" hidden>
  </section>

  <footer class="bar">
    <div class="left"><span class="live" id="live"></span><span class="topic" id="topic"></span><span class="engine" id="engine" hidden></span></div>
    <div class="pill" id="pill" role="toolbar" aria-label="Call controls">
      <button class="ib" id="hist" type="button" aria-label="Conversation" data-tip="Conversation" aria-expanded="false" aria-controls="pHist"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
      <button class="ib" id="back" type="button" aria-label="Back 10 seconds" data-tip="Back 10 s" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
      <button class="ib" id="cancel" type="button" aria-label="Cancel" data-tip="Cancel" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="ib mic" id="talk" type="button" aria-label="Talk" data-tip="Talk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg><span class="spin" aria-hidden="true"></span></button>
      <button class="ib send" id="send" type="button" aria-label="Send" data-tip="Send" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></button>
      <button class="ib" id="playpause" type="button" aria-label="Play" data-tip="Play" hidden><svg class="i-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg><svg class="i-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="ib" id="type" type="button" aria-label="Type instead" data-tip="Type instead" aria-expanded="false" aria-controls="pType"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg></button>
      <span class="sep" id="sep" hidden></span>
      <button class="ib" id="callsbtn" type="button" aria-label="Other calls" data-tip="Other calls" aria-expanded="false" aria-controls="pCalls" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="dot" id="callsdot" hidden></span></button>
    </div>
    <div class="right"><button class="ib" id="gear" type="button" aria-label="Settings" data-tip="Settings" aria-expanded="false" aria-controls="pGear"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </footer>

  <div class="toast" id="toast" role="status" hidden><span id="toasttext"></span><button class="tbtn" id="retry" type="button" hidden>Retry</button></div>

  <div class="pop gearpop" id="pGear" role="dialog" aria-label="Settings" hidden>
    <div><h4>Theme</h4><div class="segc" id="theme" role="group" aria-label="Theme">
      <button type="button" data-choice="light"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
      <button type="button" data-choice="dark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark</button>
      <button type="button" data-choice="system"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Auto</button>
    </div></div>
    <div><h4>I speak</h4><div class="segc" id="lang" role="group" aria-label="Language I speak"></div></div>
    <div><h4>Voice speed</h4><div class="segc" id="speeds" role="group" aria-label="Voice speed"></div></div>
    <button class="row" id="autoplay" type="button" aria-pressed="true">Play new answers by themselves<span class="sw" aria-hidden="true"></span></button>
    <button class="row" id="follow" type="button" aria-pressed="true">Stage follows the voice<span class="sw" aria-hidden="true"></span></button>
    <button class="endbtn" id="end" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.5l1.3-1.3a2 2 0 0 1 2.1-.4 12.8 12.8 0 0 0 2.8.7 2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.2 4.2 2 2 0 0 1 5.2 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.4 2.1L9.2 9.9"/><path d="M22 2L2 22"/></svg><span id="endlbl">End call</span></button>
  </div>

  <div class="pop callspop" id="pCalls" role="dialog" aria-label="Other calls" hidden><h4>Open calls</h4><nav id="calls" aria-label="Other calls"></nav></div>

  <section class="sheet" id="pHist" aria-label="Conversation" hidden>
    <button class="ib x" id="histx" type="button" aria-label="Close the conversation" data-tip="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="convo" id="convo"><p class="empty" id="empty">Nothing has been said yet.</p></div>
  </section>

  <div class="typebar" id="pType" hidden><textarea id="text" rows="1" placeholder="Type to Claude…" aria-label="Type a message"></textarea><button class="ib go" id="sendtext" type="button" aria-label="Send text" data-tip="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>

  <audio id="audio" preload="auto"></audio>
</div>
<script>window.CFG = __CONFIG__;</script>
<script src="/static/call.js"></script>
</body></html>
