<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk</title>
<script>/* the theme before the first paint: talk.theme is "light", "dark" or "system" */
try { const t = JSON.parse(localStorage.getItem("talk.theme") || '"light"');
  document.documentElement.dataset.theme = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">__PRECONNECT__
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/call.css">
</head>
<body>
<div class="app" id="app" data-state="idle">
  <div class="frame"><div class="stage">
    <div class="stagewrap" id="stagewrap"><iframe id="stage" title="Stage" allow="clipboard-read; clipboard-write"></iframe>
      <div class="veil" id="veil"><div class="loading" id="veilwait"><span class="spin"></span>Loading the stage…</div>
        <div class="failed" id="veilfail" hidden><p>The stage did not load.</p><div><button class="btn" id="reloadstage" type="button">Reload stage</button><a class="btn" id="openstage" target="_blank" rel="noopener">Open in a new tab</a></div></div></div></div>
    <p class="nostage" id="nostage" hidden>The stage is not available for this call.</p>
  </div></div>

  <aside class="panel" id="panel" aria-label="The call">
    <div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-label="Resize the panel" title="Drag to resize"></div>
    <div class="open">
      <header class="phead">
        <span class="live" id="live"></span><span class="topic" id="topic"></span><span class="mode" id="modechip"></span>
        <button class="ib" id="callsbtn" type="button" aria-label="Other calls" data-tip="Other calls" aria-expanded="false" aria-controls="pCalls" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="dot" id="callsdot" hidden></span></button>
        <button class="ib" id="fullscreen" type="button" aria-label="Full screen" data-tip="Full screen" aria-pressed="false" hidden><svg class="i-enter" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><svg class="i-exit" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button>
        <button class="ib" id="gear" type="button" aria-label="Settings" data-tip="Settings" aria-expanded="false" aria-controls="pGear"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="ib" id="collapse" type="button" aria-label="Collapse the panel" data-tip="Collapse"><svg class="flip" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M8 10l2 2-2 2"/></svg></button>
      </header>
      <section class="convo" id="convo" aria-label="Conversation"><p class="empty" id="empty">Nothing has been said yet.</p></section>
      <div class="foot" id="foot">
        <button class="jump" id="jump" type="button" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Back to the voice</button>
        <div class="info" id="info">
          <div class="status" id="status" hidden></div><button class="undo" id="undo" type="button" hidden>Undo</button>
          <div class="prep" id="prep" hidden><span class="preplbl" id="preplbl"></span><span class="preptrack"><i id="prepfill"></i></span></div>
        </div>
        <div class="player" id="player" hidden>
          <button class="ib" id="back" type="button" aria-label="Back 10 seconds" data-tip="Back 10 s"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
          <button class="ib pp" id="playpause" type="button" aria-label="Play" data-tip="Play"><svg class="i-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg><svg class="i-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
          <input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="Position in the answer">
          <span class="time" id="time">0:00</span>
        </div>
        <div class="compose" id="pill" role="toolbar" aria-label="Talk or type">
          <button class="ib" id="cancel" type="button" aria-label="Cancel" data-tip="Cancel" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <textarea id="text" rows="1" placeholder="Type, or press the mic" aria-label="Type a message"></textarea>
          <div class="wave" id="wave" hidden><span class="bars" id="bars"></span><span class="rectime" id="rectime">0:00</span></div>
          <button class="ib go" id="sendtext" type="button" aria-label="Send text" data-tip="Send" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          <button class="ib send" id="send" type="button" aria-label="Send" data-tip="Send" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></button>
          <button class="ib mic" id="talk" type="button" aria-label="Talk" data-tip="Talk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg><span class="spin" aria-hidden="true"></span></button>
        </div>
      </div>
    </div>
    <div class="rail" id="rail">
      <button class="ib" id="expand" type="button" aria-label="Expand the panel" data-tip="Expand"><svg class="flip" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M10 10l-2 2 2 2"/></svg><span class="dot" id="raildot" hidden></span></button>
      <span class="live" id="raillive"></span>
      <span class="nowline" id="nowline"></span>
      <span class="sp"></span>
      <button class="ib" id="railback" type="button" aria-label="Back 10 seconds" data-tip="Back 10 s" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
      <span class="ring" id="ring" hidden><button class="ib pp" id="railpp" type="button" aria-label="Play" data-tip="Play"><svg class="i-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg><svg class="i-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button></span>
      <button class="ib mic" id="railtalk" type="button" aria-label="Talk" data-tip="Talk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg><span class="spin" aria-hidden="true"></span></button>
      <button class="ib" id="railgear" type="button" aria-label="Settings" data-tip="Settings" aria-expanded="false" aria-controls="pGear"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" hidden><span id="toasttext"></span><button class="tbtn" id="retry" type="button" hidden>Retry</button></div>

  <div class="pop gearpop" id="pGear" role="dialog" aria-label="Settings" hidden>
    <div><h4>Screen</h4><div class="segc" id="screen" role="group" aria-label="Screen">
      <button type="button" data-choice="desk">Desk</button><button type="button" data-choice="tv">TV</button></div></div>
    <div><h4>Panel</h4><div class="segc" id="side" role="group" aria-label="Where the panel sits">
      <button type="button" data-choice="left">Left</button><button type="button" data-choice="right">Right</button></div></div>
    <div><h4>Theme</h4><div class="segc" id="theme" role="group" aria-label="Theme">
      <button type="button" data-choice="light"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
      <button type="button" data-choice="dark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark</button>
      <button type="button" data-choice="system"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Auto</button>
    </div></div>
    <div><h4>Talking</h4><div class="segc" id="tmode" role="group" aria-label="How you talk">
      <button type="button" data-choice="manual">Press to talk</button><button type="button" data-choice="live">Live</button></div></div>
    <div class="liveopts" id="liveopts" hidden>
      <div><h4>Interrupt Claude</h4><div class="segc" id="barge" role="group" aria-label="Interrupt Claude">
        <button type="button" data-choice="talk">By talking</button><button type="button" data-choice="keyword">Say “wait”</button></div></div>
      <div><h4>Send after a pause of</h4><div class="segc" id="endpause" role="group" aria-label="Send after a pause of">
        <button type="button" data-choice="800">0.8 s</button><button type="button" data-choice="1200">1.2 s</button><button type="button" data-choice="2000">2 s</button></div></div>
    </div>
    <div><h4>Voice</h4><p class="engine" id="engine" hidden></p><div class="voices" id="voices" role="radiogroup" aria-label="Voice" hidden></div></div>
    <div><h4>I speak</h4><div class="segc" id="lang" role="group" aria-label="Language I speak"></div></div>
    <div><h4>Voice speed</h4><div class="segc" id="speeds" role="group" aria-label="Voice speed"></div></div>
    <button class="row" id="autoplay" type="button" aria-pressed="true">Play new answers by themselves<span class="sw" aria-hidden="true"></span></button>
    <button class="row" id="follow" type="button" aria-pressed="true">Stage follows the voice<span class="sw" aria-hidden="true"></span></button>
    <button class="demobtn" id="demo" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M10 9l5 2.5-5 2.5z"/></svg><span><b>Stage demo</b><small>Every board, explained, in a new tab</small></span></button>
    <button class="endbtn" id="end" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.5l1.3-1.3a2 2 0 0 1 2.1-.4 12.8 12.8 0 0 0 2.8.7 2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.2 4.2 2 2 0 0 1 5.2 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.4 2.1L9.2 9.9"/><path d="M22 2L2 22"/></svg><span id="endlbl">End call</span></button>
  </div>

  <div class="pop callspop" id="pCalls" role="dialog" aria-label="Other calls" hidden><h4>Open calls</h4><nav id="calls" aria-label="Other calls"></nav></div>



  <audio id="audio" preload="auto"></audio>
</div>
<script>window.CFG = __CONFIG__;</script>
<script src="/static/call.js"></script>
</body></html>
