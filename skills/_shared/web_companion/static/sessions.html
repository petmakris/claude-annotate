<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotate sessions</title>
<style>
@font-face {
  font-family: "Bricolage Grotesque";
  src: url(/static/fonts/BricolageGrotesque-Variable.woff2) format("woff2");
  font-weight: 200 800;
}
@font-face {
  font-family: "Monaspace Radon";
  src: url(/static/fonts/MonaspaceRadon-Regular.woff2) format("woff2");
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 32px 20px 60px;
  background: #f5f6f8;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  color: #1d1d1f;
}
.wrap { max-width: 940px; margin: 0 auto; }
.hd {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 4px;
  flex-wrap: wrap;
  gap: 6px;
}
.hd h1 { margin: 0; font-size: 22px; font-weight: 700; }
.sub { color: #83868f; font-size: 13px; margin-bottom: 18px; }
.tools { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.search {
  flex: 1;
  min-width: 180px;
  background: #fff;
  border: 1px solid #d4d8e0;
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 14px;
  color: #3a3d44;
  font-family: inherit;
  outline: none;
}
.search:focus { border-color: #0071e3; }
.seg {
  display: flex;
  border: 1px solid #d4d8e0;
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
}
.seg button {
  border: 0;
  background: transparent;
  padding: 9px 14px;
  font-size: 13px;
  color: #83868f;
  font-family: inherit;
  cursor: pointer;
}
.seg button.on { background: #0071e3; color: #fff; }
select.proj-select {
  background: #fff;
  border: 1px solid #d4d8e0;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13px;
  color: #3a3d44;
  font-family: inherit;
}
.list {
  background: #fff;
  border: 1px solid #d4d8e0;
  border-radius: 14px;
  overflow: hidden;
}
.row {
  display: grid;
  grid-template-columns: 96px 1fr 130px 150px 74px;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border-bottom: 1px solid #eef0f4;
  cursor: pointer;
  transition: background .1s;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: #f8f9fb; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.act {
  border: 1px solid #d4d8e0;
  background: #fff;
  color: #83868f;
  border-radius: 7px;
  padding: 3px 9px;
  font-size: 11.5px;
  font-family: inherit;
  cursor: pointer;
  line-height: 1.5;
  transition: color .12s, border-color .12s;
}
.act:hover { color: #0071e3; border-color: #0071e3; }
.act.ok { color: #047857; border-color: #047857; }
.act.bad { color: #b91c1c; border-color: #b91c1c; }
.act code {
  font-family: "Monaspace Radon", ui-monospace, Menlo, monospace;
  font-size: 11px;
  color: inherit;
}
/* The resume command is the primary action on a row, so it reads as a command
   rather than as one chip among several. */
.act-cmd { background: #eef0f4; border-color: #c9cdd6; color: #3a3d44; }
.act-cmd:hover { background: #fff; }
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 7px;
  vertical-align: middle;
}
.stag { font-size: 9.5px; font-weight: 700; letter-spacing: .8px; }
.slug {
  font-family: "Monaspace Radon", monospace;
  font-size: 13.5px;
  font-weight: 600;
  color: #0071e3;
}
.title { font-size: 12.5px; color: #83868f; margin-top: 3px; }
.proj {
  font-size: 12px;
  color: #3a3d44;
  background: #eef0f4;
  border: 1px solid #d4d8e0;
  border-radius: 6px;
  padding: 2px 8px;
  font-family: "Monaspace Radon", monospace;
}
.c-meta {
  font-size: 11.5px;
  color: #83868f;
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: right;
}
.c-meta .cm { font-size: 11px; }
.c-go { text-align: right; color: #0071e3; font-size: 13px; font-weight: 600; opacity: .5; }
.row:hover .c-go { opacity: 1; }
.foot { color: #83868f; font-size: 11.5px; margin-top: 12px; text-align: center; }
.empty {
  padding: 48px 18px;
  text-align: center;
  color: #83868f;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1 id="page-title">Annotate sessions</h1>
  </div>
  <div class="sub">Workspaces outlive the Claude session that made them, and survive a reboot. Open one to read it, or copy its resume command to pick it up in a fresh session.</div>
  <div class="tools">
    <input id="search" class="search" placeholder="Search name, title, project…">
    <div class="seg" id="seg">
      <button class="on" data-seg="all">All</button>
      <button data-seg="open">Open</button>
      <button data-seg="live">Live</button>
    </div>
    <select id="proj-select" class="proj-select">
      <option value="">All projects</option>
    </select>
  </div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
var ALL = [];
var segment = "all";
// Filled from /api/whoami before the first render — the page cannot derive
// the shareable host from window.location, since the owner normally browses
// on localhost.
var HOSTS = { port: location.port, public_host: "", shareable: false };
// The resume command is skill-specific ("/annotate resume <slug>"), and this
// page is served by every web_companion skill. Derived from the /health
// banner, same source as the page title.
var SKILL_CMD = "/annotate";

function statusColor(s) {
  if (s === "live") return "#047857";
  if (s === "done") return "#83868f";
  return "#9aa3b0";
}
function statusLabel(s) {
  if (s === "live") return "LIVE";
  if (s === "done") return "DONE";
  return "IDLE";
}
function relativeTime(unixSecs) {
  if (!unixSecs) return "";
  var deltaMs = Date.now() - (unixSecs * 1000);
  var deltaS = Math.max(0, Math.floor(deltaMs / 1000));
  if (deltaS < 60) return "just now";
  var mins = Math.floor(deltaS / 60);
  if (mins < 60) return mins + "m ago";
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "h ago";
  var days = Math.floor(hours / 24);
  if (days === 1) return "yesterday";
  return days + "d ago";
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function rowHtml(row) {
  var st = row.status || "idle";
  var dotStyle = "background:" + statusColor(st) + ";" +
    (st === "live" ? "box-shadow:0 0 0 3px rgba(4,120,87,0.2);" : "");
  var slug = escapeHtml(row.slug || row.sid || "");
  var title = escapeHtml(row.title || "");
  var project = escapeHtml(row.project || "");
  var commentCount = row.comment_count || 0;
  var last = relativeTime(row.last_active);
  return (
    '<div class="row" data-slug="' + slug + '">' +
      '<div class="c-status"><span class="dot" style="' + dotStyle + '"></span>' +
        '<span class="stag" style="color:' + statusColor(st) + '">' + statusLabel(st) + '</span></div>' +
      '<div class="c-name"><span class="slug">' + slug + '</span>' +
        '<div class="title">' + title + '</div>' +
        actionsHtml(row, slug) +
      '</div>' +
      (row.project ? '<div class="c-proj"><span class="proj">' + project + '</span></div>' : '') +
      '<div class="c-meta"><span class="cm">💬 ' + commentCount + '</span>' + (last ? '<span class="last">' + last + '</span>' : '') + '</div>' +
      '<div class="c-go">Open →</div>' +
    '</div>'
  );
}

// Per-row actions. The resume command is the reason this page exists after a
// reboot: the workspace outlives every Claude session that ever touched it,
// and this is the one string that gets a fresh session back into it.
//
// A closed workspace gets no resume command on purpose — attaching to one
// reopens the directory but the page still renders "this round is closed", so
// offering the command would be offering a dead end.
function actionsHtml(row, slug) {
  var out = [];
  if (row.status !== "done") {
    var cmd = SKILL_CMD + " resume " + (row.slug || row.sid || "");
    out.push('<button class="act act-cmd" data-copy="' + escapeHtml(cmd) + '"' +
             ' title="Copy the command that reattaches a fresh Claude session to this workspace">' +
             '<code>' + escapeHtml(cmd) + '</code></button>');
  }
  out.push('<button class="act" data-copy="' + escapeHtml(localUrl(slug)) +
           '" title="Copy the local link (this machine only)">local link</button>');
  if (HOSTS.shareable) {
    out.push('<button class="act" data-copy="' + escapeHtml(publicUrl(slug)) +
             '" title="Copy the shareable link — read-only for anyone but you">shareable link</button>');
  }
  return '<div class="acts">' + out.join("") + '</div>';
}

function localUrl(slug) {
  return location.protocol + "//localhost:" + (HOSTS.port || location.port) +
         "/s/" + slug + "/";
}
function publicUrl(slug) {
  return "http://" + HOSTS.public_host + ":" + HOSTS.port + "/s/" + slug + "/";
}

// navigator.clipboard needs a secure context. localhost qualifies; a LAN or
// Tailscale address over plain HTTP does not — and browsing this page from
// another device is exactly when copying matters most. Hence the fallback.
function copyText(text, btn) {
  function done(ok) {
    var original = btn.getAttribute("data-label") || btn.innerHTML;
    btn.setAttribute("data-label", original);
    btn.innerHTML = ok ? "copied ✓" : "copy failed";
    btn.classList.add(ok ? "ok" : "bad");
    setTimeout(function () {
      btn.innerHTML = original;
      btn.classList.remove("ok", "bad");
    }, 1200);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { done(true); },
                                             function () { done(false); });
    return;
  }
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    done(ok);
  } catch (e) {
    done(false);
  }
}

function openRow(slug) {
  location.href = "/s/" + encodeURIComponent(slug) + "/";
}

function populateProjects() {
  var select = document.getElementById("proj-select");
  var seen = {};
  var projects = [];
  ALL.forEach(function (row) {
    var p = row.project || "";
    if (p && !seen[p]) {
      seen[p] = true;
      projects.push(p);
    }
  });
  projects.sort();
  select.innerHTML = '<option value="">All projects</option>' +
    projects.map(function (p) {
      return '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + '</option>';
    }).join("");
}

function render() {
  var searchText = (document.getElementById("search").value || "").toLowerCase();
  var selectedProject = document.getElementById("proj-select").value;
  var listEl = document.getElementById("list");
  var footEl = document.getElementById("foot");

  var rows = ALL.filter(function (row) {
    // "all" shows everything the server still holds — live, idle and closed.
    // Workspaces past retention are already gone from the response, so there
    // is nothing deleted to filter out here.
    if (segment === "live" && row.status !== "live") return false;
    if (segment === "open" && row.status === "done") return false;
    if (selectedProject && row.project !== selectedProject) return false;
    if (searchText) {
      var haystack = (
        (row.slug || "") + " " + (row.title || "") + " " + (row.project || "")
      ).toLowerCase();
      if (haystack.indexOf(searchText) === -1) return false;
    }
    return true;
  });

  rows.sort(function (a, b) {
    return (b.last_active || 0) - (a.last_active || 0);
  });

  if (rows.length === 0) {
    listEl.innerHTML = '<div class="empty">No workspaces yet</div>';
    footEl.textContent = "";
    return;
  }

  listEl.innerHTML = rows.map(rowHtml).join("");
  footEl.textContent = rows.length + (rows.length === 1 ? " workspace" : " workspaces") + " · sorted by last activity";

  Array.prototype.forEach.call(listEl.querySelectorAll(".row"), function (el) {
    el.addEventListener("click", function () {
      openRow(el.getAttribute("data-slug"));
    });
  });
  // Bound after the row handler and stopping propagation, so copying a link
  // does not also navigate away from the page you wanted to copy it from.
  Array.prototype.forEach.call(listEl.querySelectorAll(".act"), function (btn) {
    btn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      ev.preventDefault();
      copyText(btn.getAttribute("data-copy"), btn);
    });
  });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("proj-select").addEventListener("change", render);
Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function (btn) {
  btn.addEventListener("click", function () {
    segment = btn.getAttribute("data-seg");
    Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function (b) {
      b.classList.toggle("on", b === btn);
    });
    render();
  });
});

// Skill-aware page title: this browser is served by any web_companion skill
// (annotate, interactive-review, …). Derive the label from the server banner
// ("<skill>-server vN") so a non-annotate skill isn't mislabeled. Falls back
// to the hardcoded "Annotate sessions" if /health is unreachable.
// Both of these feed the rows (the skill name becomes the resume command, the
// hosts become the copyable links), so the list waits for them rather than
// rendering once with placeholders and re-rendering a frame later. Neither is
// allowed to fail the page: a rejected probe degrades to a sensible default.
var skillReady = fetch("/health")
  .then(function (r) { return r.text(); })
  .then(function (banner) {
    var skill = (banner || "").trim().replace(/-server\b.*$/, "");
    if (!skill) return;
    SKILL_CMD = "/" + skill;
    var words = skill.replace(/-/g, " ");
    var label = words.charAt(0).toUpperCase() + words.slice(1) + " sessions";
    document.title = label;
    var h = document.getElementById("page-title");
    if (h) h.textContent = label;
  })
  .catch(function () { /* keep the default title and command prefix */ });

var hostsReady = fetch("/api/whoami")
  .then(function (r) { return r.json(); })
  .then(function (info) {
    HOSTS = {
      port: info.port || location.port,
      public_host: info.public_host || "",
      shareable: !!info.shareable,
    };
  })
  .catch(function () { /* keep local-only links */ });

Promise.all([skillReady, hostsReady])
  .then(function () { return fetch("/api/sessions?scope=all"); })
  .then(function (r) { return r.json(); })
  .then(function (rows) {
    ALL = rows || [];
    populateProjects();
    render();
  })
  .catch(function () {
    ALL = [];
    render();
  });
</script>
</body>
</html>
