name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the declared floor (Path.is_relative_to in uploads.py).
        # It is in the matrix so the number in the README stays true.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # test_diff_engine.py and test_code_paint.py run the page's code under
      # node. Without node on the runner they SKIP, and CI would still be green.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest skills -q -rs

  vscode-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
