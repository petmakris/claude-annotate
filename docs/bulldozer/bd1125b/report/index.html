<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Side panel run · What Claude changed in the /talk side panel, one topic per slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* The spotlight: one screen at a time. Left, the real screen with everything dimmed except the part in focus.
   Right, what that part means, joined to it by a dashed line. A bar at the bottom moves between parts. */
:root {
  --bg: #eef2f6; --card: #ffffff; --ink: #14202e; --dim: #4c5b6c; --line: #d5dbe3; --soft: #e9eef4;
  --accent: #1f5fbf; --accent-soft: #e3ecfa; --shade: rgba(20, 32, 46, .58);
  --today: #1f7a45; --today-soft: #e3f3ea; --design: #9a5b00; --design-soft: #fbf0dc;
  --code-bg: #eef1f5;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--accent); }
code { font: 12.5px/1.4 var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; padding-block: 14px 10px; min-width: 0; }
.top .tag { font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.top h1 { font-size: 17px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top h1 a { color: inherit; text-decoration: none; }
.progress { flex: 1; min-width: 40px; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); gap: 36px; align-items: center; min-height: 0; position: relative; }
.stage { min-width: 0; min-height: 0; height: 100%; display: grid; align-items: center; justify-items: center; }
.screen { min-width: 0; max-width: 100%; display: grid; gap: 8px; justify-items: start; }
.frame { position: relative; display: inline-block; max-width: 100%; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(15, 25, 40, .06), 0 8px 24px rgba(15, 25, 40, .06); }
.frame img { display: block; max-width: 100%; max-height: calc(100dvh - 190px); width: auto; height: auto; }
.frame .html { padding: 18px; max-height: calc(100dvh - 190px); overflow: auto; }
.source { font-size: 12.5px; color: var(--dim); max-width: 100%; }
/* the shade: everything dimmed except the holes cut for the parts in focus */
svg.shade { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
svg.shade .dim { fill: var(--shade); transition: opacity .3s ease; }
svg.shade .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
svg.shade .ring.halo { stroke: #fff; stroke-width: 6; opacity: .9; }

/* explanation */
.explain { min-height: 0; max-height: 100%; overflow-y: auto; padding: 4px 4px 4px 0; }
.part { display: grid; gap: 14px; animation: rise .35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.count { font: 600 12px/1 var(--body); color: var(--accent); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.chip { font: 600 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 5px 9px;
  background: var(--accent-soft); color: var(--accent); }
.chip.today { background: var(--today-soft); color: var(--today); }
.chip.design { background: var(--design-soft); color: var(--design); }
.part h2 { font-size: clamp(22px, 2.3vw, 30px); line-height: 1.15; font-weight: 600; }
.part > p.screen-claim { color: var(--ink); font-weight: 600; font-size: 14px; }
.part > p { color: var(--dim); font-size: 15.5px; max-width: 60ch; }
.hint { font-size: 13.5px !important; }
kbd { font: 600 12px/1 var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 6px; background: var(--card); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.facts div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.facts b { font: 600 19px/1.15 var(--display); overflow-wrap: anywhere; }
.facts span { color: var(--dim); font-size: 13px; }
.examples { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.examples li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px; align-items: start;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
.examples .draw { font-size: 13px; line-height: 1.7; min-width: 0; }
.examples .draw a { pointer-events: none; text-decoration: none; }
.examples .m { font-size: 13.5px; display: grid; gap: 2px; }
.examples small { color: var(--dim); font-size: 11.5px; letter-spacing: .02em; }
.examples small.none { font-style: italic; }
.foot { font-size: 12.5px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 10px; }

/* connector from the explanation to the part in focus */
svg.link { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
svg.link path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 5; opacity: .8; }
svg.link circle { fill: var(--accent); stroke: #fff; stroke-width: 2; }

/* controls: square text buttons and one thin segment per part, a gap between screens */
.bar { display: flex; align-items: center; justify-content: center; gap: 18px; padding-block: 12px max(14px, env(safe-area-inset-bottom, 0px)); }
.bar button.nav { font: 500 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line); background: transparent;
  color: var(--ink); border-radius: 0; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.bar button.nav:hover:not(:disabled) { border-color: var(--ink); }
.bar button.nav.primary { background: var(--ink); border-color: var(--ink); color: var(--card); }
.bar button.nav.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
.bar button.nav:disabled { opacity: .3; cursor: default; }
.dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; align-items: center; min-width: 0; }
.dots button { width: 16px; height: 3px; border-radius: 0; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.dots button:hover { background: var(--dim); }
.dots button[aria-current="step"] { background: var(--ink); }
.dots .gap { width: 8px; height: 3px; background: transparent; margin: 0; }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); align-items: start; gap: 18px; }
  .stage { height: auto; }
  .frame img { max-height: none; }
  .frame .html { max-height: none; }
  svg.link { display: none; }
  .bar { position: sticky; bottom: 0; background: var(--bg); }
  .top h1 { white-space: normal; }
  .examples li { grid-template-columns: minmax(0, 1fr); gap: 6px; }
}
@media (max-width: 560px) { .dots { display: none; } .bar { justify-content: space-between; } }
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
<style>
.ba{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:28px;font:18px/1.5 Inter,system-ui,sans-serif;color:#151826;background:#fff;border-radius:12px}
.ba.three{grid-template-columns:1fr 1fr 1fr}
.ba.one{grid-template-columns:1fr}
.side{border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.side h4{margin:0;font:700 14px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.side p{margin:0}
.before{background:#fbe9e7}.before h4{color:#b3261e}
.after{background:#e5f4ec}.after h4{color:#16794a}

code{font:15px "JetBrains Mono",monospace;background:#0000000d;padding:1px 5px;border-radius:4px}
.ba.one .side p+p{margin-top:2px}
.facts3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}

.rowsbox .hd,.rowsbox .rw{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ratings{width:100%;border-collapse:collapse;font-size:15px}

.todo{border:3px dashed #b26a00;background:#fff4e0}

</style>

<script id="spec" type="application/json">{"tag": "Side panel run", "title": "What Claude changed in the /talk side panel, one topic per slide", "out": "index.html", "css": "stage.css", "footer": "Pictures: the call page before the run and after it, same calls and same words.", "screens": [{"id": "intro", "label": "What this is", "html": "<div class=\"ba one\"><div class=\"side today\"><h4>What this report is about<\/h4><p><b>/talk<\/b> is a call with Claude: you type or speak, Claude answers aloud, and a <b>stage<\/b> beside the panel shows boards (a table, a diagram, a map, some code) while the voice reads. The <b>side panel<\/b> is the narrow column on the right of the call page: the conversation, the player and the box you type in.<\/p><p>An earlier study, with 14 AI test users, found 99 problems with that panel and proposed 14 quick fixes and 5 larger steps (99 + 14 + 5 = 118 entries, each one thing to fix). This run built all of it. Then it ran two <b>rounds<\/b>: in each, 14 new test users (a teacher, a carpenter on a phone, a blind accountant, and so on) used the rebuilt panel, and what they hit was fixed.<\/p><p>The test users are AI agents who did not know they were being tested. Each drove a real call in a browser and then rated the page from 0 to 10 (10 is perfect).<\/p><div class=\"facts3\"><div><b>193<\/b>entries, each one problem to fix, all fixed (118 from the study and its fixes + 30 from round 1 + 33 from round 2)<\/div><div><b>14<\/b>of the study's entries were fixed, found broken again by test users, and fixed a second time<\/div><div><b>171<\/b>of the 193 are something a person sees or feels; the other 21 are a hidden fault, a test or a rule for Claude<\/div><\/div><table class=\"ratings\"><tr><th>Average rating of the page, 0 to 10, 14 test users each time<\/th><th>Average<\/th><th>Lowest<\/th><th>Highest<\/th><\/tr><tr><td>Before the run (the study)<\/td><td>6.3<\/td><td>5.5<\/td><td>7.5<\/td><\/tr><tr><td>After round 1<\/td><td>6.9<\/td><td>6.5<\/td><td>8<\/td><\/tr><tr><td>After round 2<\/td><td>6.8<\/td><td>5<\/td><td>8<\/td><\/tr><\/table><\/div><\/div>", "steps": [{"title": "Claude fixed all 193 problems in the call page's side panel; test users rate it 6.8, up from 6.3", "text": ["Every slide after this one is one change you can see or feel, with the page before and after. The rating rose after round 1 and stayed level after round 2 (6.9, then 6.8): each new group of test users found new problems (6 serious ones in round 1, 3 in round 2), so it did not climb further. The ratings are an AI's impression, a rough sign and not a measurement."], "boxes": []}]}, {"id": "s1", "label": "Step 1 Calls", "source": "Before: the call page as it was. After: the same page, same calls.", "steps": [{"title": "The Calls button counts the calls that need you and lists them by need", "text": ["A call is one conversation with Claude; you can have several open, and the stacked-layers button at the top of the panel lists them (a call needs you when it waits for you, has new answers or has stalled). Before, every call had the same blue dot. Now each has an icon and a word (Stalled means nobody picked the question up; also 2 new answers, Answering, Waiting for you), the ones that need you come first, and Next waiting jumps to the first of them. Before, a browser tab's title never changed; now its title and icon show the same state."], "boxes": []}], "w": 796, "h": 1052, "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAQcAxwDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAcBAwQFBgII/8QAaRAAAQMDAgEECA0NDgQGAAENAQACAwQFEQYSIQcTFDEVFyJBUVaT0hYyNFJUVWFyc5SVsdEIGCM1U3GBhJGSsrTTJDM3OEJGV2KhpKWzw+NmgsHiJTZjdHWiReHw8UN2g4W1wiYoo8T/xAAbAQEBAAMBAQEAAAAAAAAAAAAAAQIDBQQGB//EAEMRAQABAgIFBwgIBQUBAQEBAAABAhEDBBIhMVKRBRMUQVFxoRUzYYGisdHwIjI0U3KSweEk ">Greek capitals lose the accents and sit tight; Greek numbers use a decimal comma<\/div><\/div><div class=\"rw\"><div class=\"b\">A long line of code was cut at the stage's edge<\/div><div class=\"a\">Long lines wrap by default; with the existing Wrap lines switch off, a line that goes on fades at the edge<\/div><\/div><div class=\"rw\"><div class=\"b\">The menu listing an answer's boards opened with its header and first rows hidden<\/div><div class=\"a\">The menu opens whole, newest first<\/div><\/div><div class=\"rw\"><div class=\"b\">A bars board said \"1 days\"<\/div><div class=\"a\">It says \"1 day\"<\/div><\/div><div class=\"rw\"><div class=\"b\">On a TV a small table sat tiny in the middle of a big stage<\/div><div class=\"a\">A small table fills most of the stage<\/div><\/div><div class=\"rw\"><div class=\"b\">A step popup stayed open over the board after the voice moved on<\/div><div class=\"a\">It closes when the voice moves on, with a close button big enough to tap<\/div><\/div><\/div>", "steps": [{"title": "Seven more stage faults are fixed: titles, Greek, code, lists, wording and popups", "text": ["A board is one thing the stage shows (a table, a diagram, code). These changes are small, each in a different place, so they share a slide."], "boxes": []}]}, {"id": "keys-sr", "label": "Keyboard and screen reader", "html": "<div class=\"rowsbox\"><div class=\"hd\"><h4 class=\"b\">Before<\/h4><h4 class=\"a\">After<\/h4><\/div><div class=\"rw\"><div class=\"b\">Settings opened without taking focus and sat last in the Tab order<\/div><div class=\"a\">Opening Settings puts you inside it, and Escape puts you back on the gear<\/div><\/div><div class=\"rw\"><div class=\"b\">The keyboard shortcuts were undocumented<\/div><div class=\"a\">A hint under the box shows Space and the arrows, and ? lists every key<\/div><\/div><div class=\"rw\"><div class=\"b\">A long Tab path through the whole panel<\/div><div class=\"a\">Tab offers skip links (a link that jumps past a block) to the message box and the player, and Alt then B jumps to the board<\/div><\/div><div class=\"rw\"><div class=\"b\">A screen reader said nothing when Claude started or finished<\/div><div class=\"a\">It says Claude is working, what it is working on, and Answer 3 arrived<\/div><\/div><div class=\"rw\"><div class=\"b\">Board changes on the stage were silent; a flowchart was one picture<\/div><div class=\"a\">Board changes are announced, and each arrow of a flowchart is read with its ends and its yes or no<\/div><\/div><div class=\"rw\"><div class=\"b\">The conversation had no headings<\/div><div class=\"a\">Each answer is a heading a screen reader can jump between, and the first stop in the panel is the newest answer<\/div><\/div><div class=\"rw\"><div class=\"b\">Enter on an earlier answer's Play dropped the keyboard to the page<\/div><div class=\"a\">The keyboard stays on the player's button<\/div><\/div><\/div>", "steps": [{"title": "People who use a keyboard or a screen reader can now reach, hear and replay every answer", "text": ["A screen reader is software that reads the page aloud for people who cannot see it. These seven are the main changes; the second page lists all 193 entries."], "boxes": []}]}, {"id": "tv-phone", "label": "TV and phone", "html": "<div class=\"rowsbox\"><div class=\"hd\"><h4 class=\"b\">Before<\/h4><h4 class=\"a\">After<\/h4><\/div><div class=\"rw\"><div class=\"b\">TV size was a buried setting; a big screen opened in desk size<\/div><div class=\"a\">A big screen offers TV size once, in a line above the box, and never changes size by itself; the Full screen button enlarges the panel too<\/div><\/div><div class=\"rw\"><div class=\"b\">In TV size the chips, labels and time stayed small<\/div><div class=\"a\">They are as big as the answer text<\/div><\/div><div class=\"rw\"><div class=\"b\">On a phone the step arrows and chips were too small to tap<\/div><div class=\"a\">The player, the strip's switch and the card buttons are thumb-sized<\/div><\/div><div class=\"rw\"><div class=\"b\">On a phone the Follow button squeezed the stage title to \"F...\"<\/div><div class=\"a\">Follow is a small eye icon and the title is readable<\/div><\/div><div class=\"rw\"><div class=\"b\">A phone's table lost its last row under a fade, with no sign<\/div><div class=\"a\">A small badge says how many rows are out of sight<\/div><\/div><div class=\"rw\"><div class=\"b\">The settings popup hid End call below the screen on a TV or phone<\/div><div class=\"a\">Settings scroll and End call is always at the bottom<\/div><\/div><div class=\"rw\"><div class=\"b\">Sequence boards had small faint notes on a TV<\/div><div class=\"a\">Replies, notes and compare titles read from across the room<\/div><\/div><\/div>", "steps": [{"title": "The panel is now usable on a TV across the room and on a phone with one thumb", "text": ["The TV view is a 1280 pixel wide screen read from a sofa; the phone view is 390 pixels wide. A sequence board is a diagram of who sends what to whom, step by step; a compare board shows two of them, before and after."], "boxes": []}]}, {"id": "settings", "label": "Settings and wording", "html": "<div class=\"rowsbox\"><div class=\"hd\"><h4 class=\"b\">Before<\/h4><h4 class=\"a\">After<\/h4><\/div><div class=\"rw\"><div class=\"b\">Choosing Greek changed only what was spoken; the page stayed English<\/div><div class=\"a\">The whole panel, the wait card and the stage toolbar are Greek<\/div><\/div><div class=\"rw\"><div class=\"b\">The page opened in Light whatever the computer used; two buttons were both called Auto<\/div><div class=\"a\">A computer set to dark opens dark; only one button is called Auto<\/div><\/div><div class=\"rw\"><div class=\"b\">Voice speed was buried in settings; asking to go slower sent Claude a question<\/div><div class=\"a\">Speed is one tap in the player; typing slower or faster moves it<\/div><\/div><div class=\"rw\"><div class=\"b\">Hover tips covered the player time and the line under it<\/div><div class=\"a\">Tips open away from what you are reading<\/div><\/div><div class=\"rw\"><div class=\"b\">Only earlier answers could be copied; times were a bare 14:05<\/div><div class=\"a\">The newest answer has Copy; times say Yesterday or the date<\/div><\/div><div class=\"rw\"><div class=\"b\">The Key points chip said \"+1\" with no meaning<\/div><div class=\"a\">It says Key points and how many points that answer added<\/div><\/div><\/div>", "steps": [{"title": "Language, theme, speed and labels now say what they do and remember what you chose", "text": ["Key points is a board Claude keeps of each answer's main lines; the chip is the small button under an answer that puts it on the stage. Your choices are remembered in this browser."], "boxes": []}]}, {"id": "corrections", "label": "Corrections and queued answers", "html": "<div class=\"rowsbox\"><div class=\"hd\"><h4 class=\"b\">Before<\/h4><h4 class=\"a\">After<\/h4><\/div><div class=\"rw\"><div class=\"b\">A correction did not stop the earlier answer, which then spoke over you<\/div><div class=\"a\">The earlier answer is tagged Replaced and never plays over the new one<\/div><\/div><div class=\"rw\"><div class=\"b\">A queued answer said \"Next answer ready\" with no way to skip<\/div><div class=\"a\">A row says Next: answer 4, plays when this one ends, with Skip<\/div><\/div><div class=\"rw\"><div class=\"b\">Take back withdrew only the newest of several waiting questions<\/div><div class=\"a\">It takes back every question Claude has not picked up, puts them in the box in order, and says how many came back<\/div><\/div><div class=\"rw\"><div class=\"b\">Send again left a note for 7 seconds, then no trace<\/div><div class=\"a\">The card keeps a line saying when it was sent again<\/div><\/div><div class=\"rw\"><div class=\"b\">The top strip and the wait card showed different clocks<\/div><div class=\"a\">Both show the same clock and the same word<\/div><\/div><div class=\"rw\"><div class=\"b\">\"Claude is finishing the earlier question\" showed even when that question's session had ended<\/div><div class=\"a\">It shows only when that is true<\/div><\/div><div class=\"rw\"><div class=\"b\">A stalled question said \"Check the terminal\" (the window Claude runs in)<\/div><div class=\"a\">It says Not picked up and that your question is saved in the call, with Send again, Copy question and Take back<\/div><\/div><\/div>", "steps": [{"title": "Interrupting Claude, queueing and taking back questions now behave the way the card says", "text": ["A correction is a second question sent while Claude is still answering the first. A stalled question is one nobody picked up."], "boxes": []}]}, {"id": "guide", "label": "What Claude is told", "html": "<div class=\"rowsbox\"><div class=\"hd\"><h4 class=\"b\">Before<\/h4><h4 class=\"a\">After<\/h4><\/div><div class=\"rw\"><div class=\"b\">A user who insisted on a table got a sequence diagram; rows were cut to four<\/div><div class=\"a\">A user who asks for a table gets it, up to 8 rows by 6 columns<\/div><\/div><div class=\"rw\"><div class=\"b\">A request for a picture of a physical thing got boxes and arrows<\/div><div class=\"a\">Claude says no board draws that, instead of faking it<\/div><\/div><div class=\"rw\"><div class=\"b\">A day-by-day plan with costs was drawn as actors and arrows<\/div><div class=\"a\">Claude is guided to bars or a short table<\/div><\/div><div class=\"rw\"><div class=\"b\">A long typed message was answered in part<\/div><div class=\"a\">It is answered point by point<\/div><\/div><div class=\"rw\"><div class=\"b\">When a table overlapped, Claude apologised at length<\/div><div class=\"a\">Claude says the page is at fault and gives the facts another way<\/div><\/div><div class=\"rw\"><div class=\"b\">A draft email shown on the stage kept its long lines running off a phone<\/div><div class=\"a\">The draft wraps on a phone<\/div><\/div><\/div>", "steps": [{"title": "Claude's own instructions for the call now cover tables, pictures, long messages and drafts", "text": ["The guide is the short text every Claude session reads before it answers on a call. Most of these change what Claude puts on the stage rather than the page itself."], "boxes": []}]}, {"id": "still", "label": "Still hit", "html": "<div class=\"rowsbox\"><div class=\"hd\"><h4 class=\"b\">What round 2 test users still hit<\/h4><h4 class=\"a\">What was done about it<\/h4><\/div><div class=\"rw\"><div class=\"b\">The marathon-call tester rated 5: 14 minutes with no answer, and a status line that said Claude was finishing an earlier question<\/div><div class=\"a\">The status line is fixed. The cause of the silence is unknown: no answer reached that call in the test.<\/div><\/div><div class=\"rw\"><div class=\"b\">The voice-first tester rated 5: the microphone heard nothing in three tries<\/div><div class=\"a\">The test browser had no real microphone, so voice input was not tested for a person. Not fixed.<\/div><\/div><div class=\"rw\"><div class=\"b\">The email writer rated 6: no clean Copy for an email<\/div><div class=\"a\">Copy is labelled and drafts wrap; nobody has re-tested getting an email out.<\/div><\/div><div class=\"rw\"><div class=\"b\">A phone user could not reach the last row of a long table<\/div><div class=\"a\">A pill now says rows are out of sight. Not re-tested.<\/div><\/div><div class=\"rw\"><div class=\"b\">Wanted and not built: a text size slider, three calls side by side, a preview of a call's board<\/div><div class=\"a\">Not built.<\/div><\/div><div class=\"rw\"><div class=\"b\">A screen reader still met a map drawn as one picture<\/div><div class=\"a\">Map, graph and bars now have a reading list; not re-tested.<\/div><\/div><\/div>", "steps": [{"title": "After round 2 two test users still rated the page 5, and the fixes made after round 2 were never re-tested by a test user", "text": ["The run stopped after round 2 because the run's rule (another round only while the last one found 5 or more new serious problems, meaning ones that stop someone doing the task; at most 3 rounds) was met by round 1 (6 found, so round 2 ran) and not by round 2 (3 found, so the run stopped). Round 2's fixes rest on the automatic tests alone. Still open: voice input and the three wishes. Fixed but never re-tested: the rest."], "boxes": []}]}, {"id": "vote", "label": "The vote", "html": "<div class=\"ba three\"><div class=\"side after\"><h4>Prefer the new panel<\/h4><p><b>8<\/b> votes<\/p><\/div><div class=\"side no\"><h4>Prefer the old panel<\/h4><p><b>2<\/b> votes<\/p><\/div><div class=\"side today\"><h4>About the same<\/h4><p><b>0<\/b> votes<\/p><\/div><\/div>", "steps": [{"title": "In the final vote, 8 of 10 ballots preferred the new panel, 2 the old one and 0 saw no difference", "text": ["**Tally**\n\n- New wins 8 of 10. Old wins 2 of 10.\n- Strength points: new 27, old 6.\n- The two old wins were a tester (3) and a tester (3).\n\n**Reasons that came up more than once for the new version**\n\n- **Status wording:** &quot;Your turn&quot;, &quot;Waiting for you&quot; and &quot;Playing answer N&quot; were praised by the first timer, the returning catcher, the interrupter and the screen reader. The long typer also liked the status wording, but still chose old.\n- **Earlier answers kept compact:** a folded list with Hear again, search, a board list and chips. The power user, returning catcher, searcher, interrupter and screen reader all said so.\n- **Keyboard and screen-reader support:** shortcuts, a hint line, a visible focus ring, skip links, headings per answer and labelled board chips. The power user, keyboard-only user and screen-reader user said so.\n- **Boards that fit the request:** real tables that fit 390 px, and readable tables. The phone user, first timer and returning catcher said so.\n\n**Reasons that came up for the old version**\n\n- The page was calmer and less crowded, with a big board and a big caption (listener, phone user).\n- Long messages were shown whole in a bubble, in one scrolling conversation (long typer).\n\n**Worst things still found in the new version**\n\n1. **Crowded, busy side panel.** Small text, key hints and many buttons. The first timer, returning catcher, listener, screen reader and phone user said so.\n2. **Stale or wrong board, and a wordy &quot;no board&quot; notice.**\n   - The stage stayed on an old diagram for answers 3 to 5.\n   - It kept the old bar chart and said no board could draw a diagram.\n   - The notice for an answer with no board is long.\n   - A wrong label read &quot;1 hours a week&quot;.\n3. **Content cut or hidden.**\n   - Answer text is cut at the bottom of the expanded card, and &quot;Show all&quot; is easy to miss.\n   - On a phone the chart&#x27;s title and first rows are scrolled off.\n   - On a phone the player and the Following bar are clipped.\n4. **The earlier-answers list is cramped.** It shows about 2.5 rows.\n5. **Long messages are folded.** They are cut to three lines with Show all, and paragraph breaks are lost. This is why the long typer chose old.\n6. **Keyboard start.** The text box has no focus on load, so it took 14 Tabs to reach it. Typing on the mode buttons switched to Live by accident. The first sends did nothing.\n7. **Wrong board for a correction.** After a rent correction it gave a rent-only bar chart, not the redone table.\n8. **First send did nothing on a phone**.\n9. **Typed text is lost on reload.** The long typer saw this in both versions.\n10. **The stage iframe is empty in the accessibility tree.** The screen-reader user could not read the table or diagram, and this was true of both versions.\n\n**Fixed in new, broken in old**\n\nOverprinted table text was the most-reported defect. The first timer, returning catcher and keyboard-only user all saw it in the old version, not the new one. The old version&#x27;s &quot;Playing on another screen&quot; message also appeared with one tab open (returning catcher, long typer).\n\n**After the vote**\n\nTwo more passes checked every problem above on the rebuilt panel and fixed them: the &quot;1 hours&quot; label, the stale board and long notice, the phone chart and player, the cut card, the first send, the draft kept over a reload, the field&#x27;s focus on load, long typed messages, a name and caption for the board a screen reader reads, more rows of earlier answers on a laptop, and a correction that redoes its board."], "boxes": []}]}, {"id": "decisions", "label": "Decisions without you", "html": "<div class=\"ba three\"><div class=\"side today\"><h4>Today<\/h4><p>One AI designer split the call page's one big script into ten files, each owned by one of five AI builders, before they started. The whole run is merged to main and pushed. The live talk on the Mac picks it up as soon as the Mac answers again (it did not answer when the run ended).<\/p><\/div><div class=\"side after\"><h4>If you agree<\/h4><p>Nothing to do. The page behaves the same and each builder worked without clashing with the others.<\/p><\/div><div class=\"side no\"><h4>If you do not<\/h4><p>The ten files can be joined back into one. It only moves code between files, so it can be undone and loses no behaviour.<\/p><\/div><\/div>", "steps": [{"title": "One decision was made without you: the page's script was split so five builders could work at once", "text": ["Your rule is that a shared file gets one owner instead of builders waiting for each other; the split is how that was done. The tests passed after every landing (3368 at the end of the build), and undoing it costs one rework of the file layout plus one test run. Nothing in this run needs your password, a payment or a device. A second call: the final vote named five defects after the rounds had ended, so one more pass checked and fixed them before the merge. Write \"no to the split\" in the chat to have it undone. <a href=\"details.html\" target=\"_blank\">The second page<\/a> lists all 193 entries."], "boxes": []}]}], "link": ""}</script>
<script>// The spotlight a screen is explained with, one part at a time: everything dimmed except the parts in focus,
// each ringed, and a dashed line from the lit part to the heading that explains it. Shared by the /spotlight skill's
// single-file page (its build pastes this file in) and the stage's screen board (a copy in skills/stage/static,
// kept identical by skills/tests/test_shared_static_copies.py). A classic script: it sets window.Spotlight.
(function () {
  const NS = "http://www.w3.org/2000/svg";
  let uid = 0;

  function el(name, attrs) {
    const e = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }

  // Dims all of `svg` (width x height, in the frame's pixels) except `rects` ({x, y, w, h}), and rings each.
  // No rects: nothing is dimmed.
  function shade(svg, width, height, rects) {
    svg.textContent = "";
    if (!rects || !rects.length) return;
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    const id = "spot" + (++uid);
    const mask = el("mask", { id });
    mask.append(el("rect", { width, height, fill: "#fff" }));
    for (const r of rects) mask.append(el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 6, fill: "#000" }));
    const defs = el("defs", {});
    defs.append(mask);
    svg.append(defs, el("rect", { class: "dim", width, height, mask: `url(#${id})` }));
    for (const cls of ["ring halo", "ring"]) {
      for (const r of rects) svg.append(el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 6, class: cls }));
    }
  }

  // Draws the dashed line in `path` (and its end `dot`) from the right edge of the lit rects, inside `frame`,
  // to the left of `heading`, all in `container`'s coordinates. Returns false (and draws nothing) when there is
  // no room between the two, as on a narrow screen where the text sits under the picture.
  function link(container, frame, rects, heading, path, dot) {
    path.setAttribute("d", "");
    dot.setAttribute("r", 0);
    if (!rects || !rects.length || !heading) return false;
    const box = container.getBoundingClientRect(), fr = frame.getBoundingClientRect();
    const right = Math.min(fr.right, fr.left + Math.max(...rects.map((r) => r.x + r.w))) - box.left;
    const top = Math.max(fr.top, fr.top + Math.min(...rects.map((r) => r.y)));
    const bottom = Math.min(fr.bottom, fr.top + Math.max(...rects.map((r) => r.y + r.h)));
    const mid = (top + bottom) / 2 - box.top;
    const h = heading.getBoundingClientRect();
    const x1 = right + 6, x2 = h.left - box.left - 12, y2 = h.top + Math.min(h.height, 40) / 2 - box.top;
    if (x2 - x1 < 12 || h.top >= fr.bottom) return false;
    const cx = (x1 + x2) / 2;
    path.setAttribute("d", `M${x1},${mid} C${cx},${mid} ${cx},${y2} ${x2},${y2}`);
    dot.setAttribute("cx", x1);
    dot.setAttribute("cy", mid);
    dot.setAttribute("r", 5);
    return true;
  }

  // An image screen's boxes ([x, y, w, h] in the drawn screen's pixels) as rects in the image's laid-out size.
  function boxRects(img, w, h, boxes) {
    const kx = img.clientWidth / w, ky = img.clientHeight / h;
    return (boxes || []).map(([x, y, bw, bh]) => ({ x: x * kx, y: y * ky, w: bw * kx, h: bh * ky }));
  }

  // An HTML screen's parts, found by selector, as rects in the frame's coordinates, with a little room round them.
  function focusRects(frame, focus) {
    const fr = frame.getBoundingClientRect(), out = [];
    for (const sel of [].concat(focus || [])) {
      for (const e of frame.querySelectorAll(sel)) {
        const r = e.getBoundingClientRect();
        if (r.width || r.height) out.push({ x: r.left - fr.left - 4, y: r.top - fr.top - 4, w: r.width + 8, h: r.height + 8 });
      }
    }
    return out;
  }

  window.Spotlight = { shade, link, boxRects, focusRects };
})();
</script>
<script>
(() => {
  const spec = JSON.parse(document.getElementById("spec").textContent);
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), explain = $("explain"), main = $("main"), dotsEl = $("dots");
  const NS = "http://www.w3.org/2000/svg";

  $("tag").textContent = spec.tag || "";
  if (spec.link) { const a = document.createElement("a"); a.href = spec.link; a.target = "_blank"; a.rel = "noopener"; a.textContent = spec.title; $("title").appendChild(a); }
  else $("title").textContent = spec.title;

  // Flatten screens into parts: one part per step, each knowing its screen.
  const parts = [];
  spec.screens.forEach((s, si) => s.steps.forEach((st, k) => parts.push({ s, si, st, k })));

  // One element per screen, built once and shown when its part is.
  const screens = spec.screens.map((s) => {
    const wrap = document.createElement("div");
    wrap.className = "screen"; wrap.hidden = true;
    const frame = document.createElement("div");
    frame.className = "frame";
    if (s.src) {
      const img = document.createElement("img");
      img.src = s.src; img.alt = s.alt || s.label || ""; img.width = s.w; img.height = s.h;
      img.addEventListener("load", () => place());
      frame.appendChild(img);
    } else {
      const h = document.createElement("div");
      h.className = "html"; h.innerHTML = s.html;
      frame.appendChild(h);
    }
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "shade"); svg.setAttribute("aria-hidden", "true");
    frame.appendChild(svg);
    wrap.appendChild(frame);
    if (s.source || spec.footer) {
      const c = document.createElement("p");
      c.className = "source"; c.innerHTML = [s.source, spec.footer].filter(Boolean).join(" · ");
      wrap.appendChild(c);
    }
    stage.appendChild(wrap);
    return { wrap, frame, svg, s };
  });

  // The explanation for each part, built once.
  const panels = parts.map((p, n) => {
    const sec = document.createElement("section");
    sec.className = "part"; sec.hidden = true;
    const meta = document.createElement("div"); meta.className = "meta";
    const count = document.createElement("span"); count.className = "count"; count.textContent = `${n + 1} / ${parts.length}`;
    meta.appendChild(count);
    if (p.s.label && spec.screens.length > 1) {
      const chip = document.createElement("span");
      chip.className = "chip" + (p.s.phase ? " " + p.s.phase : "");
      chip.textContent = p.s.phase === "design" ? `Design · ${p.s.label}` : p.s.label;
      meta.appendChild(chip);
    }
    sec.appendChild(meta);
    if (p.s.title) { const c = document.createElement("p"); c.className = "screen-claim"; c.innerHTML = p.s.title; sec.appendChild(c); }
    const h = document.createElement("h2"); h.innerHTML = p.st.title; sec.appendChild(h);
    [].concat(p.st.text || []).forEach((t) => { const e = document.createElement("p"); e.innerHTML = t; sec.appendChild(e); });
    if (p.st.facts && p.st.facts.length) {
      const f = document.createElement("div"); f.className = "facts";
      p.st.facts.forEach((x) => { const d = document.createElement("div"); d.innerHTML = `<b>${x.big}</b><span>${x.small}</span>`; f.appendChild(d); });
      sec.appendChild(f);
    }
    if (p.st.examples && p.st.examples.length) {
      const ul = document.createElement("ul"); ul.className = "examples";
      p.st.examples.forEach((x) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="draw">${x.draw}</span><span class="m">${x.means}<small class="${x.seen ? "" : "none"}">${x.seen ? "Seen on " + x.seen : "Not seen yet"}</small></span>`;
        ul.appendChild(li);
      });
      sec.appendChild(ul);
    }
    if (n === 0) {
      const hint = document.createElement("p"); hint.className = "hint";
      hint.innerHTML = "Press <kbd>&rarr;</kbd> or Next to walk through it one part at a time.";
      sec.appendChild(hint);
    }
    explain.appendChild(sec);
    return sec;
  });

  parts.forEach((p, n) => {
    if (n > 0 && p.si !== parts[n - 1].si) { const g = document.createElement("span"); g.className = "gap"; dotsEl.appendChild(g); }
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", `Part ${n + 1}: ${panels[n].querySelector("h2").textContent}`);
    b.title = panels[n].querySelector("h2").textContent;
    b.addEventListener("click", () => go(n));
    dotsEl.appendChild(b);
  });
  const dotButtons = [...dotsEl.querySelectorAll("button")];

  let i = 0;

  // The spotlight itself (dim, rings, the dashed line) is skills/_shared/static/spotlight.js, pasted in below by
  // build.py: the stage's screen board draws with the same file.
  const S = window.Spotlight;
  function rects(scr, st) {
    return scr.s.src ? S.boxRects(scr.frame.querySelector("img"), scr.s.w, scr.s.h, st.boxes) : S.focusRects(scr.frame, st.focus);
  }
  function shade(scr, rs) { S.shade(scr.svg, scr.frame.clientWidth, scr.frame.clientHeight, rs); }
  function connect(scr, rs) {
    const path = $("linkpath"), dot = $("linkdot");
    if (getComputedStyle($("link")).display === "none") { path.setAttribute("d", ""); dot.setAttribute("r", 0); return; }
    S.link(main, scr.frame, rs, panels[i].querySelector("h2"), path, dot);
  }

  function place() {
    const p = parts[i], scr = screens[p.si];
    const rs = rects(scr, p.st);
    shade(scr, rs);
    connect(scr, rs);
  }

  function go(n) {
    i = Math.max(0, Math.min(parts.length - 1, n));
    const p = parts[i];
    screens.forEach((scr, k) => { scr.wrap.hidden = k !== p.si; });
    panels.forEach((sec, k) => { sec.hidden = k !== i; });
    dotButtons.forEach((d, k) => (k === i ? d.setAttribute("aria-current", "step") : d.removeAttribute("aria-current")));
    $("bar").style.width = `${((i + 1) / parts.length) * 100}%`;
    $("prev").disabled = i === 0;
    $("next").disabled = i === parts.length - 1;
    try { history.replaceState(null, "", `#part-${i + 1}`); } catch (e) {}
    explain.scrollTop = 0;
    requestAnimationFrame(place);
  }

  $("prev").addEventListener("click", () => go(i - 1));
  $("next").addEventListener("click", () => go(i + 1));
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, [contenteditable]")) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(i + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(i - 1); }
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(parts.length - 1);
  });
  addEventListener("resize", place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  window.spotlightPage = { go, count: parts.length, current: () => i };
  const m = /^#part-(\d+)$/.exec(location.hash);
  go(m ? Number(m[1]) - 1 : 0);
})();
</script>
