<!doctype html>
<html><head><meta charset="utf-8"><title>shop-app release notes</title>
<style>
:root{--bg:#fff;--ink:#1f2328;--mute:#57606a;--acc:#0969da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--ink:#e6edf3;--mute:#9da7b3;--acc:#58a6ff}}
:root[data-theme="dark"]{--bg:#0d1117;--ink:#e6edf3;--mute:#9da7b3;--acc:#58a6ff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:22px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.slide{box-sizing:border-box;height:100%;padding:56px 72px;display:flex;flex-direction:column;justify-content:center}
.kicker{color:var(--acc);font-weight:700;letter-spacing:.08em;font-size:15px;text-transform:uppercase}
h1{font-size:44px;margin:.2em 0 .5em}
li{margin:.25em 0}
.mute{color:var(--mute)}
</style></head><body>
<div class="slide">
<div class="kicker">shop-app 2.4</div>
<h1>Checkout retries a timed-out charge</h1>
<ul>
<li>One timeout no longer loses the order</li>
<li>The same key never charges a card twice</li>
<li class="mute">Ships to all stores on Monday</li>
</ul>
</div>
</body></html>
