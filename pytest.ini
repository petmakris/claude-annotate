[pytest]
# Parallel by default, capped at 4 workers: every worker runs its own headless
# Chromium, and `-n auto` on a many-core laptop once coincided with a hard
# system freeze. Needs pytest-xdist (requirements-test.txt); pass `-n 0` to run
# serially, or a higher `-n` on a machine with headroom. Each worker gets its own webcompanion daemon and Chromium
# (skills/conftest.py), so workers share neither. A test that writes a fixed
# path under the repo will race here — use tmp_path or tempfile instead.
# loadgroup: tests marked @pytest.mark.xdist_group(name) run one after another on
# one worker; the live-mode scenes each drive a microphone, and side by side they
# starve a loaded machine, so skills/conftest.py splits them into LIVE_QUEUES queues.
addopts = -n 4 --dist loadgroup
markers =
    slow: a property test over a seeded corpus; deselect with -m "not slow"
    perf: a timing test, skipped unless selected with -m perf (run it with -n 0, alone)
    browser: a test in a file that drives Chromium (set by skills/conftest.py); -m "not browser" is the fast loop
