[pytest]
# Parallel by default: 2m08s serial, ~38s across cores. Needs pytest-xdist;
# pass `-n 0` to run serially. A test that writes a fixed path under the
# repo will race here — use tmp_path or tempfile instead.
addopts = -n auto
markers =
    slow: a property test over a seeded corpus; deselect with -m "not slow"
    perf: a timing test, skipped unless selected with -m perf (run it with -n 0, alone)
