[pytest]
# Parallel by default on 4 workers. Needs pytest-xdist (requirements-test.txt);
# pass `-n 0` to run serially. A test that writes a fixed path under the repo
# will race here — use tmp_path or tempfile instead.
addopts = -n 4
markers =
    slow: a property test over a seeded corpus; deselect with -m "not slow"
    perf: a timing test, skipped unless selected with -m perf (run it with -n 0, alone)
